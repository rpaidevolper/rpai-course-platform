name: 想法／需求
description: 新功能或改進。還沒想清楚也可以開，triage 時會用 grill 釐清
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決什麼問題
      description: 誰遇到、在什麼情境下、現在怎麼處理。先講問題，不要先講解法。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 做完之後的樣子
      description: 使用者能做到什麼現在做不到的事。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 已知的限制或想法
      description: 已經想到的解法、不想要的做法、相關的 issue。
