name: 想法／需求
description: 新功能或改進。還沒想清楚也可以開，triage 時會用 grill 釐清
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決什麼問題
      description: 誰遇到、在什麼情境下、現在怎麼處理。先講問題，不要先講解法。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 做完之後的樣子
      description: 使用者能做到什麼現在做不到的事。
    validations:
      required: true
  - type: dropdown
    id: north-star
    attributes:
      label: 北極星分類
      description: 北極星是「讓 RPAI 講師把一門客製課，更快備到可以上課」，分類的意思見 CLAUDE.md 的「北極星」。
      options:
        - 核心：直接讓一條標準變好（前提只談一次／教材彼此一致／從團隊最新的版本出發）
        - 前提：核心要靠它才跑得起來
        - 護欄：安全、機密、品質
        - 外圍：其餘功能
    validations:
      required: true
  - type: textarea
    id: north-star-why
    attributes:
      label: 對標說明
      description: 核心寫出讓哪一條標準變好；前提與護欄寫出它撐住哪個核心功能；外圍寫出為什麼現在做。
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 已知的限制或想法
      description: 已經想到的解法、不想要的做法、相關的 issue。
