name: AI Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    # 只審 collaborator 從本 repo 分支開的 PR。fork 來的 PR 會 skip（required check 視為通過），不消耗額度。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            你是這個 PR 唯一的 reviewer：這個 repo 不要求人類 approve，你沒抓到的問題會直接進 main。

            先讀：
            - `gh pr view` 與 `gh pr diff` 取得 PR 內容
            - PR 內文 `Closes #N` 連結的 issue（`gh issue view N --comments`），那是這次改動的規格
            - `CLAUDE.md`，以及存在的話 `GLOSSARY.md` 和 `docs/adr/` 中與改動範圍相關的 ADR

            檢查：
            1. 規格：issue 的每一條驗收條件是否都做到，有沒有做了規格以外的事。
            2. 正確性：邏輯錯誤、沒處理的邊界情況、安全問題（特別是 CLAUDE.md 的 MCP 與資料規範：owner 過濾、RLS）。
            3. 測試：新行為有沒有測試；測試驗的是對外行為，不是實作細節；有沒有為了過而寫的空測試。
            4. 一致性：命名是否使用 glossary 的詞彙，是否違反既有 ADR 或 CLAUDE.md 的規範。

            回報方式：
            - 必須修的問題用 inline comment（mcp__github_inline_comment__create_inline_comment）留在對應的程式碼行，
              寫明問題、為什麼是問題、建議怎麼改。每一則 inline comment 都必須被處理並 resolve 後才能合併，
              所以只留真正需要處理的問題，風格偏好與小建議不要用 inline comment。
            - 最後用 `gh pr comment` 留一則總結：驗收條件逐條對照的結果、inline comment 的數量，
              以及不擋合併的小建議。沒有發現問題就明說。
            - 全部用繁體中文。
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
