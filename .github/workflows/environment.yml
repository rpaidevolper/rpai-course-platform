name: Environment

# 驗證 Dev Container 與 production image 真的建得起來、跑得起來。
# 只在相關檔案變動時執行，不是 required check。
on:
  pull_request:
    paths: &paths
      - .devcontainer/**
      - Dockerfile
      - .dockerignore
      - supabase/**
      - scripts/db-start.sh
      - package.json
      - pnpm-lock.yaml
      - next.config.ts
      - .github/workflows/environment.yml
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            node --version && pnpm --version && gh --version && claude --version && docker --version
            pnpm lint
            pnpm typecheck
            pnpm test
            pnpm db:start
            set -a && . ./.env.local && set +a
            # migrations 已套用：courses 表可以透過 API 查詢
            curl --fail --silent --show-error \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/courses?select=id"
            echo

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # 每個頁面請求都會經過 src/proxy.ts，它要 NEXT_PUBLIC_SUPABASE_*（build 時寫進 bundle）。
      # 這裡不連資料庫，給假值就好：沒有 session 時不會真的打 Supabase。
      - run: >-
          docker build -t rpai-course-platform
          --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=build-placeholder .
      - name: Login page responds and / redirects to it
        run: |
          docker run -d --name app -p 3000:3000 rpai-course-platform
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:3000/login; then
              location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://localhost:3000/)
              if [[ "$location" == http://localhost:3000/login* ]]; then
                echo "OK"; exit 0
              fi
              echo "GET / 沒有導去登入頁：${location:-（沒有 Location）}"
              break
            fi
            sleep 1
          done
          docker logs app
          exit 1
